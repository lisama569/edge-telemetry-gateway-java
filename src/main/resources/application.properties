spring.application.name=edge-telemetry-gateway
server.port=8080

# ---- 边缘网关配置（edge.gateway.*） ----
# 本地缓存目录（WAL 与消费方水位文件所在）
edge.gateway.data-dir=data/gateway
# 缓存容量：尚未被全部消费方确认的条目数上限
edge.gateway.cache-capacity=1000
# 缓存满时采集侧最长等待时间，超时显式背压拒绝（不静默丢弃）
edge.gateway.offer-timeout-ms=2000
# 转发批量大小（FIFO，按 entryId 升序）
edge.gateway.fetch-batch-size=50
# WAL/水位写入后是否 force 刷盘（崩溃安全）
edge.gateway.fsync=true

logging.level.com.github.lisama569=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %logger{36} - %msg%n
