spring.application.name=edge-telemetry-gateway

# 本地缓存：目录与容量（容量满时确定性地淘汰最旧并计数）
telemetry.buffer.dir=./data/buffer
telemetry.buffer.capacity=10000

# 转发：批次大小与循环间隔
telemetry.forward.batch-size=100
telemetry.forward.interval-millis=1000

# 双下游幂等台账目录（每个下游一个 ledger-<name>.json，崩溃重启后按身份去重续传）
telemetry.fanout.ledger-dir=./data/ledger
# 判定日志保留条数（内存，供 /api/decisions 查询）
telemetry.decision-log.capacity=1000
