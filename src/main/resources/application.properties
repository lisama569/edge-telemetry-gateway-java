spring.application.name=edge-telemetry-gateway

# 缓存目录
# - 单出口模式（telemetry.archive.enabled=false）：云端使用 ${dir}/buffer.jsonl，满则淘汰最旧
# - 双下游模式（默认）：两个下游共享 ${dir}/fanout/fanout-log.jsonl 一条准入日志，
#   每侧游标 cursor-cloud.properties / cursor-archive.properties，满则整条两边一致拒绝
telemetry.buffer.dir=./data/buffer
telemetry.buffer.capacity=10000

# 双下游共享准入日志容量（与 telemetry.buffer.capacity 取较小值生效）
telemetry.fanout.capacity=10000

# 下游幂等身份账本目录（独立于网关进程，重启后保留，用于崩溃续传判重）
telemetry.identity.dir=./data/identities

# 转发：批次大小与循环间隔（每个下游各自独立的转发循环与独立游标）
telemetry.forward.batch-size=100
telemetry.forward.interval-millis=1000

# 归档旁路：true 时为 cloud+archive 双下游（共享准入日志，强一致）；false 退化为原单出口
telemetry.archive.enabled=true
