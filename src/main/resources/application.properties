spring.application.name=edge-telemetry-gateway

# 下游数据目录
telemetry.buffer.dir=./data/buffer
# 双下游共享扇出队列容量（cloud+archive 同一条队列）。
# 容量是“仍至少被一个下游占用（未全部确认）”的最大条数；满时采集写入被确定性拒绝
# （REJECTED/BUFFER_FULL，背压、可重试），不淘汰任何数据，因此两边不会分叉。
telemetry.buffer.capacity=10000

# 下游幂等身份账本目录（各下游独立文件，独立于网关进程，重启后保留，用于崩溃续传判重）
telemetry.identity.dir=./data/identities

# 转发：批次大小与循环间隔（每个下游各自独立的转发循环）
telemetry.forward.batch-size=100
telemetry.forward.interval-millis=1000

# 归档旁路：true 时为 cloud+archive 双下游共享队列；false 退化为原单出口
telemetry.archive.enabled=true
# 说明：双下游共享同一条队列，容量统一由 telemetry.buffer.capacity 决定；
# 该开关为 true 时此配置项仅为兼容保留、不再产生第二条独立缓存。
telemetry.archive.buffer.capacity=10000
